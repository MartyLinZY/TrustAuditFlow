services:
  runner:
    command: python3 src/consortium_runner.py --config config/consortium_mnist_low_trust_experiment.json --output-dir container_results_mnist_lowtrust
    volumes:
      - ./container_results_mnist_lowtrust:/app/container_results_mnist_lowtrust
      - ./config:/app/config:ro
      - ./src:/app/src:ro
      - ./data:/app/data:ro
